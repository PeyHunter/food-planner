# Sends plain http visitors to https.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Public hostname. cert-manager issues the certificate; external-dns creates the Cloudflare record from the host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: food-planner-redirect-https@kubernetescrd
spec:
  tls:
    - hosts: [food-planner.peytonhunter.com]
      secretName: food-planner-tls
  rules:
    - host: food-planner.peytonhunter.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
