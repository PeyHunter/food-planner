# Only the app may connect to PostgreSQL. k3s enforces this with kube-router; kubelet probes from the node are always let through.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: food-planner
      ports:
        - port: 5432
