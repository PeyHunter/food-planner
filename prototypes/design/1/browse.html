<main class="page content-grid">
  <header class="topbar">
    <h1 class="page-title"><span class="scribble">Browse</span></h1>
    <div class="actions">
      <button class="icon-btn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>

  <div class="full-width chip-row" role="group" aria-label="Filter">

    <button class="chip tag" aria-pressed="false"><span>freezable</span></button>

    <div class="ghost g2" aria-hidden="true"></div>

  <g fill="#fbf6ea" opacity="0.9"><circle cx="318" cy="40" r="3"/><circle cx="330" cy="52" r="2"/><circle cx="40" cy="120" r="2.5"/></g>
</svg>

        <span class="price-tag badge">35 min</span>

      <div class="body">
        <h2 class="dish-title"><a href="recipe.html" style="text-decoration:none">Oven salmon with lemon, dill &amp; new potatoes</a></h2>

          <span class="pill t-fish">Fish</span>
          <span class="pill tagged">kid-friendly</span>
          <span>Feeds 4</span><i class="sep"></i><span>Made 3×</span>

      </div>
